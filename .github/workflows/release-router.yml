name: Build and push sglang-router to Harbor

on:
  push:
    tags:
      - 'aa/release/*'

permissions:
  contents: read

env:
  HARBOR_HOST: harbor.management-prod01.stackit.run
  CONTAINER_REPOSITORY: inference-images
  IMAGE_NAME: sglang-router
  DOCKERFILE: docker/Dockerfile.sgl_router

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version and image refs
        id: meta
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#aa/release/}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          IMAGE="${HARBOR_HOST}/${CONTAINER_REPOSITORY}/${IMAGE_NAME}"
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "VERSION_TAG=${IMAGE}:${RELEASE_VERSION}" >> $GITHUB_ENV
          echo "SHA_TAG=${IMAGE}:${RELEASE_VERSION}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "LATEST_TAG=${IMAGE}:latest" >> $GITHUB_ENV
          echo "BUILD_CACHE=${IMAGE}:buildcache" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASS }}

      - name: Local build for smoke test (load image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          load: true
          tags: local/sglang-router:test
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}

      - name: Smoke test
        run: |
          docker run --rm local/sglang-router:test --help | head -n 20

      - name: Build and push to Harbor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ env.VERSION_TAG }}
            ${{ env.SHA_TAG }}
            ${{ env.LATEST_TAG }}
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}
          cache-to: type=registry,ref=${{ env.BUILD_CACHE }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
